<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" fill="none" role="img" aria-labelledby="title description">
  <title id="title">autodl-renter · 把等待交给命令行</title>
  <desc id="description">零依赖的 AutoDL 算力抢租工具，支持 Python 3.9、条件筛选、任务恢复和 Agent。右侧展示离线预览示例，并非实时报价。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#18263C"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="accent" x1="604" y1="0" x2="1118" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#73E2C1" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#73E2C1" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#BACBDD" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="bounds"><rect width="1200" height="350" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#bounds)">
